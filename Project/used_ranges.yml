- (0x02FFCC, 0x02FFD5) # M3 Sprites (0xC2FFCC-0xC2FFD0) & HP/PP meter guard (0xC2FFD1-0xC2FFD5)
- (0x320000, 0x330FFF)	# Reserved for the Extended PSI animations
